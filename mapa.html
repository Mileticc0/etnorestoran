<div class="north">S</div>
<div class="ctl"><button id="zi" aria-label="Uvećaj">+</button><button id="zo" aria-label="Umanji">−</button></div>
<script>
const home=[43.301756,20.8876391];
const map=L.map('map',{zoomControl:false,scrollWheelZoom:false,attributionControl:true});
const peak=[43.2733,20.8253];
const fit=()=>{const w=map.getSize().x;map.fitBounds(L.latLngBounds([home,peak]),{paddingTopLeft:[w<520?40:70,90],paddingBottomRight:[w<520?240:260,70],maxZoom:14,animate:false});};
fit();window.addEventListener('resize',()=>{map.invalidateSize();fit();});
const flip=()=>{const l=document.querySelector('.pin .lbl');if(!l)return;l.style.left='22px';l.style.right='auto';if(l.getBoundingClientRect().right>map.getSize().x-16){l.style.left='auto';l.style.right='22px';}};
map.on('moveend zoomend resize',flip);setTimeout(flip,300);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
map.attributionControl.setPrefix(false);
L.marker(home,{icon:L.divIcon({className:'',html:'<div class="pin"><div class="ring"></div><div class="d"></div><div class="lbl"><b>Etno Kuća Brzeće</b><span>Bore Stankovića 1</span></div></div>',iconSize:[0,0]})}).addTo(map)
 .on('click',()=>window.open('https://www.google.com/maps/dir/?api=1&destination=43.301756,20.8876391','_blank'));
L.marker(peak,{interactive:false,icon:L.divIcon({className:'',html:'<div class="peak"><i></i><div>Pančićev vrh<small>2017 m</small></div></div>',iconSize:[0,0]})}).addTo(map);
document.getElementById('zi').onclick=()=>map.zoomIn();
document.getElementById('zo').onclick=()=>map.zoomOut();
